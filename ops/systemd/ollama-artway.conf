[Service]
# Lokalny model jest wyłącznie awaryjnym zapleczem sklepu i nie może być
# wystawiony do internetu ani zabierać zasobów procesowi sprzedażowemu.
Environment="OLLAMA_HOST=127.0.0.1:11434"
Environment="OLLAMA_KEEP_ALIVE=30s"
Environment="OLLAMA_NUM_PARALLEL=1"
Nice=10
CPUQuota=300%
MemoryHigh=5G
MemoryMax=6G
