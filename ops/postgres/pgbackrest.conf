[global]
repo1-path=/srv/artway/backups/pgbackrest
repo1-retention-full=7
repo1-retention-diff=14
repo1-bundle=y
repo1-block=y
compress-type=zst
compress-level=3
process-max=2
start-fast=y
archive-async=y
spool-path=/var/spool/pgbackrest
log-level-console=info
log-level-file=detail

[artway]
pg1-path=/var/lib/postgresql/17/main
pg1-port=5432
