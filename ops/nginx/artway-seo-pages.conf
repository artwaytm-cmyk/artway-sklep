# Wstawiany do głównego bloku server artwaytm.pl. Czyste adresy publiczne są
# renderowane przez backend, dzięki czemu robot od razu otrzymuje treść i JSON-LD.
location = / {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:3000/;
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
}

location ~ ^/(?:produkt|kategoria|konkurs)/[^/]+/?$ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:3000;
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
    proxy_cache_bypass $http_cache_control;
}

# Publiczne strony informacyjne również przechodzą przez backend. Dzięki temu
# ceny i warunki dostawy są w pierwszym HTML zawsze zgodne z ustawieniami,
# bez przebudowy statycznych plików i bez oczekiwania na skrypt przeglądarki.
location ~ ^/(?:promocje|nowosci|konkursy|o-nas|faq|kontakt|regulamin|prywatnosc|dostawa|zwroty)/?$ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:3000;
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
}

# Konta, koszyk i historia klienta są podstronami użytkowymi, a nie stronami
# docelowymi dla wyszukiwarki. Jawny nagłówek zapobiega indeksowaniu ich jako
# kopii strony głównej mimo routingu SPA.
location ~ ^/(?:logowanie|rejestracja|konto|zamowienia|ulubione|koszyk)(?:/|$) {
    # Zawsze obsługuj te adresy powłoką SPA w bieżącej lokalizacji. Próba
    # wejścia do istniejącego katalogu wykonywała wewnętrzne przekierowanie do
    # /index.html i gubiła ustawiony niżej nagłówek X-Robots-Tag.
    try_files /index.html =404;
    include /srv/artway/shop/ops/nginx/artway-security-headers.conf;
    add_header X-Robots-Tag "noindex, follow" always;
    add_header Cache-Control "no-store" always;
}

location ^~ /api/seo/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:3000;
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
    include /srv/artway/shop/ops/nginx/artway-security-headers.conf;
    add_header Cache-Control "no-store" always;
}
